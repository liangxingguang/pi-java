# JLine 需构建时初始化（TamboUI jline3 后端，§4.2）。
# org.jline.nativ（本地库绑定层）必须运行时初始化——其 <clinit> 调用 native 方法
# （如 CLibrary$WinSize.init()），构建时初始化会 UnsatisfiedLinkError。
# 完整 reflect-config 由 Tracing Agent 冒烟生成后并入本目录（§6）。
Args = --initialize-at-build-time=org.jline \
       --initialize-at-run-time=org.jline.nativ
